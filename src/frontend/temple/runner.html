<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCLP Runner — Đà Lạt</title>
</head>
<body style="margin:0;background:#0d1512;color:#e7eae2;font-family:monospace">
<p id="st" style="padding:1.5rem">Đang tải runner…</p>
<script>
/* Trang đích RedirectResponse(/temple/runner.html) từ main.py — KHÔNG để trống.
 * Tách nội dung UI đầy đủ sang /static/runner_payload.b64 (gzip base64).
 * UI: candidates thật + grid chọn + bán kính động theo taxonomy.
 */
(async function () {
  var st = document.getElementById("st");
  try {
    var r = await fetch("/static/runner_payload.b64");
    if (!r.ok) throw new Error("HTTP " + r.status);
    var b64 = (await r.text()).trim();
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var ds = new DecompressionStream("gzip");
    var stream = new Blob([bytes]).stream().pipeThrough(ds);
    var html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    st.innerHTML = "<b>Lỗi tải runner:</b> " + e.message +
      " — kiểm tra /static/runner_payload.b64";
  }
})();
</script>
</body>
</html>

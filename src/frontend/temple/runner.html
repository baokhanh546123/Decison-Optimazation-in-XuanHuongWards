<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCLP Runner</title>
<script>
// Bootstrap: load full UI from same-origin static (no external GitHub fetch)
(function(){
  var urls = ['/static/runner_app.html'];
  function fail(msg){
    document.body.innerHTML = '<div style="font-family:monospace;color:#8ea092;padding:40px;max-width:560px;margin:10vh auto;line-height:1.7">'+
      '<b style="color:#d4a24e">Kh\u00f4ng t\u1ea3i \u0111\u01b0\u1ee3c runner</b><br/>'+msg+
      '<br/><br/>Ch\u1ea1y:\n<code style="color:#d4a24e">cp artifacts/runner_full_geo.html src/frontend/static/runner_app.html</code>'+
      '<br/>r\u1ed3i restart server + hard refresh.</div>';
  }
  fetch(urls[0]).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status+' — thi\u1ebfu /static/runner_app.html');
    return r.text();
  }).then(function(html){
    document.open(); document.write(html); document.close();
  }).catch(function(e){ fail(e.message); });
})();
</script>
</head>
<body style="margin:0;background:#0d1512;color:#8ea092;font-family:ui-monospace,monospace;display:flex;align-items:center;justify-content:center;min-height:100vh">
  <p>\u0110ang t\u1ea3i runner (c\u00f9ng origin)…</p>
</body>
</html>

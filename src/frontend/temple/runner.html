<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCLP Runner — loading…</title>
  <style>
    body {
      margin: 0;
      background: #0d1512;
      color: #8ea092;
      font-family: ui-monospace, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <p id="msg">Đang tải runner từ main…</p>
  <script>
    (function () {
      var URL =
        "https://raw.githubusercontent.com/baokhanh546123/Decison-Optimazation-in-XuanHuongWards/main/src/frontend/temple/runner.html";
      fetch(URL)
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.text();
        })
        .then(function (html) {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function (err) {
          document.getElementById("msg").textContent =
            "Không tải được runner.html từ main: " + err.message +
            ". Copy artifacts/runner_from_main.html → src/frontend/temple/runner.html và push.";
        });
    })();
  </script>
</body>
</html>
